name: Generate riwnlmk's Shelf RSS feed

on:
  push:
    branches:
      - master
    paths:
      - 'data/technology.json'
      - 'data/psychology.json'
      - 'data/ruqyah.json'
      - 'script/generate_rss.py'
      - '.github/workflows/generate_rss.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate riwnlmk's Shelf RSS feed
        run: python script/generate_rss.py

      - name: Commit updated feed
        run: |
          if [[ -n "$(git status --porcelain -- rss.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- rss.xml
            git commit -m "Update RSS feed"
            git push
          else
            echo "RSS feed is already up to date."
          fi