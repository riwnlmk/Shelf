name: Generate RSS and llms.txt

on:
  push:
    branches:
      - master
    paths:
      - 'data/**'
      - 'scripts/generate_rss.py'
      - 'scripts/generate_llms.py'
      - '.github/workflows/generate_content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate llms.txt
        run: python scripts/generate_llms.py

      - name: Commit generated files
        run: |
          if [[ -n "$(git status --porcelain -- rss.xml llms.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- rss.xml llms.txt
            git commit -m "Update generated content files"
            git push
          else
            echo "Generated files are already up to date."
          fi