name: Generate riwnlmk's Shelf llms.txt

on:
  push:
    branches:
      - master
    paths:
      - 'data/*.json'
      - 'scripts/generate_llms.py'
      - '.github/workflows/generate_llms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate riwnlmk's Shelf llms.txt
        run: python scripts/generate_llms.py

      - name: Commit updated llms.txt
        run: |
          if [[ -n "$(git status --porcelain -- llms.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llms.txt
            git commit -m "Update llms.txt"
            git push
          else
            echo "llms.txt is already up to date."
          fi